<!-- =====================================================================
  NUANCE FM — MODE MAINTENANCE (site indisponible)
  Collez ce bloc TOUT EN HAUT du widget "Custom HTML" (avant <link rel="preconnect"...>).
  L'alerte s'affiche même si WordPress bloque le JavaScript (styles écrits directement dans le HTML).
  Pour remettre le site en ligne : supprimez ce bloc.
====================================================================== -->
<div id="nf-maintenance" role="alertdialog" aria-modal="true" aria-labelledby="nf-m-title"
  style="position:fixed!important;top:0!important;left:0!important;right:0!important;bottom:0!important;width:100vw!important;height:100vh!important;z-index:2147483647!important;display:flex!important;align-items:center!important;justify-content:center!important;padding:24px!important;margin:0!important;box-sizing:border-box!important;background:#0B0B0D radial-gradient(900px 600px at 15% -10%,rgba(242,118,35,.30),transparent 60%)!important;font-family:Manrope,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif!important;color:#F6F6F6!important;text-align:center!important;pointer-events:auto!important">
  <div style="max-width:520px;width:100%;padding:40px 28px;border-radius:28px;background:#121216;border:1px solid rgba(255,255,255,.14);box-shadow:0 40px 80px -20px rgba(0,0,0,.8);box-sizing:border-box">
    <div aria-hidden="true" style="width:64px;height:64px;margin:0 auto 20px;border-radius:50%;line-height:64px;font-size:32px;font-weight:700;color:#fff;background:linear-gradient(135deg,#F27623,#E93125)">!</div>
    <h1 id="nf-m-title" style="margin:0 0 12px;padding:0;font-family:'Space Grotesk',Manrope,system-ui,sans-serif;font-size:30px;line-height:1.2;font-weight:700;color:#fff;text-transform:none;letter-spacing:0">Site temporairement indisponible</h1>
    <p style="margin:0;padding:0;font-size:16px;line-height:1.6;color:#cfcfd4">Le site de Nuance FM n'est pas disponible pour le moment.<br>Merci de votre patience, nous revenons très bientôt.</p>
  </div>
</div>
<style>
html,body{overflow:hidden!important}
#nuance-fm-hero{display:none!important}
</style>
<script>
(function(){
  /* Désactive le lecteur radio : le NUANCE RADIO CORE voit "NuanceRadio" déjà défini et ne crée pas l'audio */
  var noop=function(){};
  if(window.NuanceRadio&&window.NuanceRadio.pause){ try{ window.NuanceRadio.pause(); }catch(e){} }
  window.NuanceRadio={version:2,audio:null,ART_URL:'',canVolume:false,
    play:noop,pause:noop,toggle:noop,on:noop,setShow:noop,setVolume:noop,setMuted:noop,
    state:function(){return 'error';},volume:function(){return 0;},muted:function(){return true;}};

  /* Place l'alerte directement dans <body> (aucun conteneur WordPress/Elementor ne peut la cacher)
     et bloque clic, clavier et son sur tout le reste du site */
  function lock(){
    var o=document.getElementById('nf-maintenance'); if(!o||!document.body) return;
    if(o.parentNode!==document.body) document.body.appendChild(o);
    Array.prototype.forEach.call(document.body.children,function(el){ if(el!==o&&el.tagName!=='SCRIPT'&&el.tagName!=='STYLE'){ el.setAttribute('inert',''); el.setAttribute('aria-hidden','true'); } });
    Array.prototype.forEach.call(document.querySelectorAll('audio,video'),function(m){ try{ m.pause(); m.removeAttribute('src'); m.load(); }catch(e){} });
  }
  lock();
  document.addEventListener('DOMContentLoaded',lock);
  window.addEventListener('load',lock);
})();
</script>
<!-- ===================== FIN MODE MAINTENANCE ===================== -->
