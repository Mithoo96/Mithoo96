<!doctype html>
<html lang="ht">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ayiti Eleksyon 2026</title>
  <style>
    :root { --bg: #ffffff; --fg: #1a1a1a; --accent: #00209f; --accent2: #d21034; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111418; --fg: #f1f1f1; --accent: #6f8cff; --accent2: #ff5a72; } }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--fg); }
    .flag { height: 8px; background: linear-gradient(to bottom, var(--accent) 50%, var(--accent2) 50%); }
    main { max-width: 720px; margin: 0 auto; padding: 48px 16px; }
    h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 0 0 12px; }
    p { font-size: 1.125rem; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="flag"></div>
  <main>
    <h1>Ayiti Eleksyon 2026</h1>
    <p>Sit la ap vini byento.</p>
  </main>
</body>
</html>
